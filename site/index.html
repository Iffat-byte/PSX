<style>
/* Layout concept: a private-banking ledger. Quiet paper-and-ink surfaces, one deep jade "statement" panel per screen,
   hairline structure instead of shadows, numbers set as the hero. Mobile: compact header + floating tab bar.
   Desktop: slim ledger rail + 1120px content column. */
/* Dark luxury: black lacquer ground, champagne-gold metal for accents, smoked-glass surfaces. Dark is the default for everyone;
   an explicit "light" choice gets an ivory-and-gold version. */
:root{
  --bg:#08090B; --surface:rgba(255,255,255,.035); --surface-solid:#121317; --surface-2:rgba(255,255,255,.055); --surface-3:rgba(255,255,255,.085); --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.15);
  --ink:#F3EEE4; --ink-2:#B9B1A2; --ink-3:#7F7869;
  --navy:#0B0B0D; --navy-2:#1A160E; --on-navy:#F7F1E4; --on-navy-2:rgba(247,241,228,.7); --on-navy-3:rgba(247,241,228,.45);
  --emerald:#D6B26E; --emerald-ink:#E8C98C; --mint:rgba(214,178,110,.12); --on-emerald:#1A1408;
  --brass:#D6B26E; --brass-soft:#F1DCAA;
  --up:#62D6A4; --loss:#FF8E7E; --loss-bg:rgba(255,142,126,.1); --gold:#E8C27A; --gold-bg:rgba(232,194,122,.1); --info:#9DB8E6; --info-bg:rgba(157,184,230,.1);
  --gain-on-dark:#62D6A4; --loss-on-dark:#FF9A8B;
  --gold-grad:linear-gradient(135deg,#F7E4B7 0%,#D9B571 40%,#A47C39 100%);
  --glow-1:rgba(214,178,110,.11); --glow-2:rgba(98,214,164,.045);
  --bar:rgba(16,16,19,.74); --rail:rgba(12,12,14,.7); --field:rgba(255,255,255,.03);
  --shadow:inset 0 1px 0 rgba(255,255,255,.04);
  --shadow-md:0 14px 36px -18px rgba(0,0,0,.85);
  --shadow-lg:0 34px 90px -34px rgba(0,0,0,.95);
  --f-ui:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-display:"Bodoni Moda",Didot,"Bodoni 72","Times New Roman",serif;
  --f-accent:"Newsreader",Georgia,"Times New Roman",serif;
  --r-xl:26px; --r-lg:20px; --r-md:15px; --r-sm:10px;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#F5F1E8; --surface:rgba(255,255,255,.72); --surface-solid:#FFFFFF; --surface-2:rgba(30,24,12,.045); --surface-3:rgba(30,24,12,.075); --line:rgba(30,24,12,.09); --line-2:rgba(30,24,12,.17);
  --ink:#17130B; --ink-2:#5C5446; --ink-3:#8F8676;
  --emerald:#9A7330; --emerald-ink:#7B5A1F; --mint:rgba(154,115,48,.1); --on-emerald:#FFF8EA;
  --up:#11815A; --loss:#B5402F; --loss-bg:rgba(181,64,47,.08); --gold:#8A6418; --gold-bg:rgba(154,115,48,.1); --info:#2F5D8A; --info-bg:rgba(47,93,138,.08);
  --gold-grad:linear-gradient(135deg,#E9CF92 0%,#C49A4E 45%,#8C6526 100%);
  --glow-1:rgba(196,154,78,.16); --glow-2:rgba(17,129,90,.05);
  --bar:rgba(255,253,248,.82); --rail:rgba(255,253,248,.7); --field:rgba(255,255,255,.8);
  --shadow:0 1px 0 rgba(30,24,12,.03); --shadow-md:0 14px 34px -20px rgba(60,44,14,.35); --shadow-lg:0 34px 80px -34px rgba(20,16,8,.6);
  color-scheme:light;
}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;font-feature-settings:"ss01","cv11"}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--emerald-ink)}
:focus-visible{outline:2px solid var(--emerald);outline-offset:2px;border-radius:10px}
#view:focus,#view:focus-visible{outline:none}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.02em;font-weight:620}
p{margin:0}
::selection{background:color-mix(in srgb,var(--emerald) 22%,transparent)}

/* ---------- shell ---------- */
.app{min-height:100%;display:flex}
.rail{display:none}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:saturate(1.4) blur(16px);-webkit-backdrop-filter:saturate(1.4) blur(16px);border-bottom:1px solid transparent;transition:border-color .2s}
.topbar.scrolled{border-bottom-color:var(--line)}
.topbar-in{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:12px;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.mark{width:34px;height:34px;border-radius:10px;background:var(--navy);display:grid;place-items:center;flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.brand-t{font-weight:640;font-size:15px;line-height:1.15;letter-spacing:-.015em;white-space:nowrap}
.brand-s{font-family:var(--f-accent);font-style:italic;font-size:13.5px;color:var(--ink-3);line-height:1.2;white-space:nowrap}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
.lang{display:flex;background:var(--surface-2);border-radius:999px;padding:3px;border:1px solid var(--line)}
.lang button{padding:4px 11px;min-height:32px;min-width:40px;border-radius:999px;font-size:12.5px;font-weight:560;color:var(--ink-3);transition:color .15s,background .15s}
.lang button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(16,26,23,.08)}
.icon-btn{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);transition:border-color .15s,color .15s}
.icon-btn:hover{color:var(--ink);border-color:var(--line-2)}
.icon-btn[disabled]{opacity:.4;pointer-events:none}
.content{width:100%;max-width:1120px;margin:0 auto;padding-top:6px;padding-bottom:calc(120px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
.screen{display:flex;flex-direction:column;gap:20px;animation:rise .4s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:.001;transform:translateY(6px)}to{opacity:1;transform:none}}

/* bottom nav — floating */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:50;padding:0 max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));pointer-events:none}
.tabbar-in{pointer-events:auto;max-width:380px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);align-items:center;background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:saturate(1.4) blur(18px);-webkit-backdrop-filter:saturate(1.4) blur(18px);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow-md);padding:6px 4px}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;font-size:10.5px;font-weight:560;color:var(--ink-3);text-decoration:none;line-height:1.15;text-align:center;border-radius:14px;transition:color .15s}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"]::after{content:"";position:absolute;top:1px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--emerald)}
.tab-add{color:var(--ink-2)}
.tab-add .plus{width:46px;height:46px;border-radius:15px;background:var(--navy);color:var(--on-navy);display:grid;place-items:center;transition:transform .15s;box-shadow:0 8px 18px -8px rgba(14,35,29,.6)}
.tab-add:active .plus{transform:scale(.94)}
.tab-add span{display:none}
.tab-add[aria-current="page"]::after{display:none}
.nbadge{position:absolute;top:0;left:calc(50% + 5px);min-width:17px;height:17px;padding:0 5px;border-radius:999px;background:var(--loss);color:#fff;font-size:10px;font-weight:650;display:grid;place-items:center;line-height:1;border:2px solid var(--surface)}
.rail .nbadge{position:static;margin-left:auto;border:0;background:var(--surface-3);color:var(--ink);min-width:22px;height:20px}

@media (min-width:920px){
  .rail{display:flex;flex-direction:column;width:248px;flex:none;position:sticky;top:0;height:100vh;border-right:1px solid var(--line);background:var(--surface);padding:24px 14px 18px;gap:26px}
  .rail .brand{padding:0 8px}
  .rail nav{display:flex;flex-direction:column;gap:2px}
  .rail a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:11px;color:var(--ink-2);text-decoration:none;font-weight:540;font-size:14.5px;transition:background .15s,color .15s}
  .rail a:hover{background:var(--surface-2);color:var(--ink)}
  .rail a[aria-current="page"]{background:var(--surface-2);color:var(--ink);font-weight:600}
  .rail a[aria-current="page"] svg{color:var(--emerald-ink)}
  .rail a svg{width:19px;height:19px}
  .rail .rail-add{background:var(--navy);color:var(--on-navy)!important;justify-content:center;margin-bottom:14px;font-weight:600}
  .rail .rail-add:hover{background:var(--navy-2)}
  .rail-foot{margin-top:auto}
  .rail-foot .notice{font-size:12.5px;padding:12px 14px}
  .tabbar{display:none}
  .topbar .brand{display:none}
  .content{padding-bottom:56px;padding-top:10px}
}

/* ---------- primitives ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.pad{padding:18px}
@media (min-width:640px){.pad{padding:22px 24px}}
.row{display:flex;align-items:center;gap:12px}
.stack{display:flex;flex-direction:column;gap:14px}
.grid2{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:860px){.grid2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.grid3{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
@media (min-width:640px){.grid3{grid-template-columns:repeat(3,minmax(0,1fr))}}
.muted{color:var(--ink-2)}
.faint{color:var(--ink-3)}
.small{font-size:13.5px}
.tiny{font-size:12px}
.h-page{font-size:26px;font-weight:620;letter-spacing:-.028em;line-height:1.15}
@media (min-width:640px){.h-page{font-size:32px}}
.h-sec{font-size:16.5px;font-weight:610;letter-spacing:-.015em}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3)}
.gain{color:var(--emerald-ink)} .loss{color:var(--loss)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:560;white-space:nowrap;line-height:1.5;max-width:100%}
.pill.demo{background:var(--gold-bg);color:var(--gold)}
.pill.ok{background:var(--mint);color:var(--emerald-ink)}
.pill.bad{background:var(--loss-bg);color:var(--loss)}
.pill.info{background:var(--info-bg);color:var(--info)}
.pill.soft{background:var(--surface-2);color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--line)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:6px 18px;border-radius:13px;font-weight:580;font-size:15px;letter-spacing:-.005em;transition:transform .12s,filter .12s,background .15s,border-color .15s;white-space:normal;max-width:100%;line-height:1.25;text-align:center;text-decoration:none}
.btn:active{transform:scale(.985)}
.btn.primary{background:var(--emerald);color:var(--on-emerald);box-shadow:inset 0 -1px 0 rgba(0,0,0,.12)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.ghost:hover{background:var(--surface-3)}
.btn.line{border:1px solid var(--line-2);background:var(--surface);color:var(--ink)}
.btn.line:hover{border-color:var(--ink-3)}
.btn.danger{background:var(--loss-bg);color:var(--loss)}
.btn.sm{min-height:36px;padding:6px 13px;font-size:13.5px;border-radius:10px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.link{color:var(--emerald-ink);font-weight:580;font-size:13.5px;display:inline-flex;align-items:center;gap:3px;text-decoration:none}
.link:hover{text-decoration:underline;text-underline-offset:3px}
.seg{display:flex;gap:2px;overflow-x:auto;padding:3px;scrollbar-width:none;background:var(--surface-2);border:1px solid var(--line);border-radius:13px;max-width:100%;width:max-content}
.seg::-webkit-scrollbar{display:none}
.seg button{white-space:nowrap;padding:7px 13px;border-radius:10px;font-weight:560;font-size:13.5px;color:var(--ink-2);transition:background .15s,color .15s;flex:none}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(16,26,23,.1),0 0 0 1px var(--line)}
.divider{height:1px;background:var(--line);margin:4px 0}

/* forms */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.lbl{font-size:12.5px;font-weight:560;color:var(--ink-2)}
.input{width:100%;min-height:48px;padding:11px 14px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);font-size:16px;transition:border-color .15s,box-shadow .15s}
.input:hover{border-color:var(--ink-3)}
.input:focus{outline:none;border-color:var(--emerald);box-shadow:0 0 0 4px color-mix(in srgb,var(--emerald) 14%,transparent)}
textarea.input{min-height:110px;resize:vertical;line-height:1.55}
.input-wrap{position:relative}
.input-wrap .pre{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--ink-3);font-weight:560;font-size:13.5px;pointer-events:none}
.input-wrap .pre+.input{padding-left:42px}
.hint{font-size:12px;color:var(--ink-3)}
.err{font-size:12.5px;color:var(--loss);font-weight:560}
.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media (min-width:640px){.choices{grid-template-columns:repeat(3,1fr)}}
.choice{padding:12px;border-radius:13px;border:1px solid var(--line-2);background:var(--surface);text-align:left;font-weight:570;font-size:14px;display:flex;align-items:center;gap:10px;transition:border-color .15s,background .15s}
.choice:hover{border-color:var(--ink-3)}
.choice small{display:block;font-weight:500;font-size:11.5px;color:var(--ink-3)}
.choice[aria-pressed="true"]{border-color:var(--emerald);background:var(--mint);color:var(--emerald-ink);box-shadow:inset 0 0 0 1px var(--emerald)}
.choice .ic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--surface-2);flex:none}
.choice[aria-pressed="true"] .ic{background:var(--surface)}
.fgrid{display:grid;gap:14px}
@media (min-width:560px){.fgrid.two{grid-template-columns:1fr 1fr}}
.fgrid.rv{grid-template-columns:1fr 1fr;gap:10px}
.fgrid.rv .field label{font-size:12px}
.fgrid.rv .input{min-height:44px;padding:9px 12px}
.fgrid.rv .input-wrap .pre+.input{padding-left:36px}
@media (min-width:760px){.fgrid.rv{grid-template-columns:repeat(3,1fr);gap:14px}}

/* statement panel (the one dark surface per screen) */
.balance{position:relative;overflow:hidden;border-radius:var(--r-xl);padding:22px 20px 20px;color:var(--on-navy);background:linear-gradient(155deg,var(--navy-2) 0%,var(--navy) 62%);box-shadow:var(--shadow-lg);isolation:isolate}
.balance::before{content:"";position:absolute;inset:0;z-index:-1;opacity:.55;background:repeating-linear-gradient(0deg,transparent 0 27px,rgba(255,255,255,.035) 27px 28px)}
.balance::after{content:"";position:absolute;right:-120px;top:-140px;width:360px;height:360px;z-index:-1;border-radius:50%;background:radial-gradient(closest-side,rgba(184,138,62,.22),transparent)}
.balance .hero-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.balance .lbl2{color:var(--on-navy-2);font-size:12px;font-weight:560;letter-spacing:.1em;text-transform:uppercase}
.balance .big{font-size:40px;font-weight:600;letter-spacing:-.035em;line-height:1.05;margin-top:14px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.balance .big .cur{font-size:.42em;font-weight:500;letter-spacing:0;color:var(--on-navy-2)}
@media (min-width:640px){.balance{padding:28px 30px 26px}.balance .big{font-size:56px}}
@media (max-width:479px){.topbar .brand-s{display:none}.topbar .brand-t{font-size:14px;white-space:normal;line-height:1.15;max-width:9.5em}.lang button{padding:4px 9px}.lang .full{display:none}}
@media (min-width:480px){.lang .short{display:none}}
.balance .chip{display:inline-flex;align-items:center;gap:6px;margin-top:12px;padding:5px 10px 5px 8px;border-radius:999px;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);font-size:13px;font-weight:560}
.balance .chip.up{color:var(--gain-on-dark)}.balance .chip.down{color:var(--loss-on-dark)}
.balance .chip .when{color:var(--on-navy-3);font-weight:500}
.balance .spark{display:block;width:100%;height:64px;margin-top:16px}
.bal-grid{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:18px;padding-top:16px;border-top:1px solid rgba(255,255,255,.1)}
.bal-grid > div{padding:0 12px;border-left:1px solid rgba(255,255,255,.1);min-width:0}
.bal-grid > div:first-child{padding-left:0;border-left:0}
.bal-grid .v{font-weight:600;font-size:14px;margin-top:4px;letter-spacing:-.015em;white-space:nowrap}
.bal-grid > div{padding:0 10px}
@media (min-width:640px){.bal-grid .v{font-size:19px}.bal-grid > div{padding:0 20px}}
.bal-grid .k{color:var(--on-navy-3);font-size:11px;font-weight:560;line-height:1.25;letter-spacing:.06em;text-transform:uppercase}
.balance .demo-tag{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:560;padding:3px 9px;border-radius:999px;background:rgba(213,174,104,.14);color:var(--brass-soft);box-shadow:inset 0 0 0 1px rgba(213,174,104,.25)}

/* quick actions */
.quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.quick-btn{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:14px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line);text-align:left;transition:border-color .15s,transform .15s;min-width:0}
.quick-btn:hover{border-color:var(--line-2);transform:translateY(-1px)}
.quick-btn .qi{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--mint);color:var(--emerald-ink)}
.quick-btn b{font-size:13.5px;font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.quick-btn .qt{display:flex;flex-direction:column;gap:2px;min-width:0;color:var(--ink)}

/* today list (home) */

.todo-row .go{margin-top:6px}
.todo-row.done{opacity:.5}
.todo-row.done h3{text-decoration:line-through}

/* tasks (updates feed) */
.task{display:flex;gap:14px;align-items:flex-start;padding:16px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line);transition:opacity .2s}
.task .ti{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:none}
.task .ti.g{background:var(--mint);color:var(--emerald-ink)} .task .ti.r{background:var(--loss-bg);color:var(--loss)} .task .ti.y{background:var(--gold-bg);color:var(--gold)} .task .ti.b{background:var(--info-bg);color:var(--info)}
.task h3{font-size:14.5px;font-weight:590;line-height:1.35}

.task.done h3{text-decoration:line-through}
.check{position:relative;width:26px;height:26px;border-radius:8px;border:1.5px solid var(--line-2);display:grid;place-items:center;flex:none;margin-left:auto;color:transparent;background:var(--surface);transition:background .15s,border-color .15s}
.check::after{content:"";position:absolute;inset:-9px}
.check:hover{border-color:var(--ink-3)}
.task.done .check,.todo-row.done .check{background:var(--emerald);border-color:var(--emerald);color:var(--on-emerald)}

/* big action tiles */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:16px;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line);text-align:left;transition:transform .15s,border-color .15s;min-width:0}
.tile:hover{transform:translateY(-1px);border-color:var(--line-2)}
.tile .ti{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--mint);color:var(--emerald-ink)}
.tile b{font-size:15px;font-weight:600;overflow-wrap:anywhere}
.tile span{font-size:12.5px;color:var(--ink-2);overflow-wrap:anywhere}
.big-opt{display:flex;align-items:center;gap:16px;padding:18px;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line);text-align:left;width:100%;transition:transform .15s,border-color .15s,box-shadow .15s}
.big-opt:hover{transform:translateY(-1px);border-color:var(--line-2);box-shadow:var(--shadow-md)}
.big-opt .ti{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;flex:none;background:var(--mint);color:var(--emerald-ink)}

.big-opt span{font-size:13.5px;color:var(--ink-2);overflow-wrap:anywhere}

/* list rows */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:13px;padding:13px 2px;border-bottom:1px solid var(--line);text-align:left;width:100%}

button.li{border-radius:0;transition:background .15s}
button.li:hover{background:color-mix(in srgb,var(--surface-2) 70%,transparent)}
.logo{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:620;font-size:11px;flex:none;color:var(--ink);background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line);letter-spacing:.02em}
.li .main-t{font-weight:600;font-size:14.5px;letter-spacing:-.01em}
.li .sub-t{font-size:12.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .sub-t.wrap{white-space:normal}
.li .right{margin-left:auto;text-align:right;flex:none}

.li .mid{min-width:0;flex:1}

.logo{position:relative}

/* bars */
.bar{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden}

.mbars{display:flex;align-items:flex-end;gap:6px;height:120px;padding-top:6px}

/* sheet / modal */
.scrim{position:fixed;inset:0;z-index:80;background:rgba(6,14,11,.5);backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s both}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:95;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:13px;font-weight:540;font-size:14px;box-shadow:var(--shadow-lg);max-width:calc(100% - 32px);animation:up .25s both;display:flex;gap:12px;align-items:center}

.notice{display:flex;gap:12px;padding:13px 15px;border-radius:var(--r-md);font-size:13.5px;line-height:1.5;color:var(--ink)}
.notice.gold{background:var(--gold-bg)} .notice.gold svg{color:var(--gold)}
.notice.info{background:var(--info-bg)} .notice.info svg{color:var(--info)}
.notice.red{background:var(--loss-bg)} .notice.red svg{color:var(--loss)}

.notice svg{flex:none;margin-top:1px}
.soon{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:28px 18px;border-radius:var(--r-lg);border:1px dashed var(--line-2);background:transparent}

.qa{display:flex;flex-direction:column;gap:10px}
.bubble{padding:11px 15px;border-radius:18px;max-width:88%;font-size:14.5px;white-space:pre-wrap;line-height:1.55}
.bubble.me{align-self:flex-end;background:var(--navy);color:var(--on-navy);border-bottom-right-radius:6px}
.bubble.bot{align-self:flex-start;background:var(--surface-2);border-bottom-left-radius:6px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border-bottom:0}

.tool{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line);text-align:left;transition:border-color .15s,transform .15s;width:100%}
.tool:hover{border-color:var(--line-2);transform:translateY(-1px)}
.tool .ti{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:var(--surface-2);color:var(--ink);flex:none}
.tool b{font-size:14.5px;font-weight:590;display:block;line-height:1.3}
.tool span{font-size:12.5px;color:var(--ink-3)}
.back{display:inline-flex;align-items:center;gap:6px;font-weight:560;color:var(--ink-2);font-size:14px;padding:6px 0;align-self:flex-start}
.back:hover{color:var(--ink)}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid currentColor;border-top-color:transparent;animation:sp .8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.preview-img{max-height:220px;border-radius:12px;border:1px solid var(--line);object-fit:contain;background:var(--surface-2);width:100%}

.empty{text-align:center;padding:30px 16px;color:var(--ink-2)}
.empty b{display:block;color:var(--ink);font-size:16px;font-weight:600;margin-bottom:4px}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{text-align:left;font-size:11px;color:var(--ink-3);font-weight:600;text-transform:uppercase;letter-spacing:.07em;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t tr:last-child td{border-bottom:0}
table.t td.r,table.t th.r{text-align:right}
.scroll-x{overflow-x:auto}
.plan{border-radius:var(--r-xl);padding:22px;background:linear-gradient(155deg,var(--navy-2) 0%,var(--navy) 70%);color:var(--on-navy)}

.stats{display:grid;grid-template-columns:minmax(0,1fr);gap:0}

.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}

body{background:radial-gradient(1100px 620px at 8% -12%,var(--glow-1),transparent 62%),radial-gradient(900px 520px at 108% 6%,var(--glow-2),transparent 60%),var(--bg);background-attachment:fixed}

const fingerprint = t => [t.date, t.type, (t.symbol || "").toUpperCase(), round2(Number(t.qty) || 0), round2(Number(t.price) || 0), round2(Number(t.amount) || 0)].join("|");

function findDuplicate(row, existing){
  const fp = fingerprint(row);
  const exact = existing.find(t => fingerprint(t) === fp);
  if (exact) return { kind:"exact", match: exact };
  const isTrade = row.type === "BUY" || row.type === "SELL";
  const near = existing.find(t => t.type === row.type && (t.symbol || "") === (row.symbol || "") && Math.abs(dayDiff(t.date, row.date)) <= 3 &&
    (isTrade ? Number(t.qty) === Number(row.qty) && Number(row.price) > 0 && Math.abs(t.price - row.price) / row.price <= 0.005

  const pctm = low.match(/(\d+(?:\.\d+)?)\s?%\s*(?:upar|up|gain|munafa|profit|return|barhega|jump|tak)/); if (pctm) claims.push({ kind: "gainPct", value: parseFloat(pctm[1]) / 100, quote: pctm[0] });
  const tf = low.match(/\b(kal|tomorrow|aaj|today|is hafte|this week|agle hafte|next week|is mahine|this month|(\d+)\s*(din|days?|hafte|weeks?|mahine|months?))\b/); if (tf) claims.push({ kind: "timeframe", quote: tf[0], days: /kal|tomorrow/.test(tf[0]) ? 1 : /aaj|today/.test(tf[0]) ? 1 : /hafte|week/.test(tf[0]) ? (tf[2] ? +tf[2] * 5 : 5) : /mahine|month/.test(tf[0]) ? (tf[2] ? +tf[2] * 21 : 21) : tf[2] ? +tf[2] : null });
  const news = low.match(/\b(dividend|bonus|right shares?|merger|acquisition|takeover|buyback|result|results|contract|order|deal|ipo|listing|government|imf)\b[^.!\n]{0,60}/); if (news) claims.push({ kind: "news", quote: news[0].trim(), topic: news[1] });
  const g = flags.find(f => f.key === "guarantee"); if (g) claims.push({ kind: "guarantee", quote: (low.match(TIP_FLAGS[0][2]) || [""])[0] });
  const reg = flags.find(f => f.key === "regClaim"); if (reg) claims.push({ kind: "registration", quote: (low.match(TIP_FLAGS[9][2]) || [""])[0] });
  const price = opts?.price > 0 ? opts.price : null; const math = {};
  const target = claims.find(c => c.kind === "target")?.value;
  if (price && target){ math.move = target / price - 1; const days = claims.find(c => c.kind === "timeframe")?.days; if (days){ math.days = days; math.perDay = Math.pow(1 + math.move, 1 / days) - 1; } }
  if (price && claims.find(c => c.kind === "stoploss")){ math.risk = claims.find(c => c.kind === "stoploss").value / price - 1; if (math.move != null && math.risk < 0) math.rr = math.move / Math.abs(math.risk); }
  if (price && claims.find(c => c.kind === "entry")){ const e = claims.find(c => c.kind === "entry"); math.entryGap = e.value / price - 1; }
  const score = flags.reduce((a, f) => a + f.weight, 0) + (math.move != null && math.move > 0.3 ? 2 : 0) + (math.perDay != null && math.perDay > 0.05 ? 2 : 0) + (syms.unknown.length && !syms.known.length ? 1 : 0);
  const risk = score >= 5 ? "high" : score >= 2 ? "medium" : "low";
  return { flags, claims, symbols: syms.known, unknownTickers: syms.unknown, price, math, score, risk, empty: raw.trim().length < 8 };
}

/* ---------- Periods ---------- */
const MONTH_IDX = {jan:1,january:1,feb:2,february:2,mar:3,march:3,apr:4,april:4,may:5,jun:6,june:6,jul:7,july:7,aug:8,august:8,sep:9,sept:9,september:9,oct:10,october:10,nov:11,november:11,dec:12,december:12};
const endOfMonth = (y, m) => `${y}-${pad2(m)}-${pad2(new Date(y, m, 0).getDate())}`;
function parsePeriod(q, today){
  const s = " " + String(q || "").toLowerCase() + " "; const [y, m] = today.split("-").map(Number);
  if (/pichle mahine|pichhle mahine|guzishta mahine|last month|previous month/.test(s)){ const pm = m === 1 ? 12 : m - 1, py = m === 1 ? y - 1 : y; return { from: `${py}-${pad2(pm)}-01`, to: endOfMonth(py, pm), key: "lastMonth", ym: `${py}-${pad2(pm)}` }; }
  if (/is mahine|iss mahine|this month|current month/.test(s)) return { from: `${y}-${pad2(m)}-01`, to: today, key: "thisMonth", ym: `${y}-${pad2(m)}` };
  if (/tax saal|tax year|fiscal|maali saal/.test(s)){ const fy = m >= 7 ? y : y - 1; return { from: `${fy}-07-01`, to: today, key: "taxYear", fy: `${fy}-${String((fy + 1) % 100).padStart(2, "0")}` }; }
  if (/pichle saal|pichhle saal|last year/.test(s)) return { from: `${y-1}-01-01`, to: `${y-1}-12-31`, key: "lastYear", year: y - 1 };
  if (/is saal|iss saal|this year/.test(s)) return { from: `${y}-01-01`, to: today, key: "thisYear", year: y };
  for (const [w, mi] of Object.entries(MONTH_IDX)){ if (new RegExp(`\\s${w}\\s`).test(s)){ const yy = `${y}-${pad2(mi)}-01` > today ? y - 1 : y; return { from: `${yy}-${pad2(mi)}-01`, to: endOfMonth(yy, mi), key: "month", ym: `${yy}-${pad2(mi)}` }; } }
  return null;
}
const periodLabel = (p) => !p ? ["ab tak", "so far"] : p.key === "lastMonth" || p.key === "month" ? [`${MONTHS_LONG[+p.ym.slice(5) - 1]} ${p.ym.slice(0, 4)}`, `${MONTHS_LONG[+p.ym.slice(5) - 1]} ${p.ym.slice(0, 4)}`] : p.key === "thisMonth" ? ["is mahine", "this month"] : p.key === "taxYear" ? [`tax saal ${p.fy}`, `tax year ${p.fy}`] : p.key === "lastYear" ? [`saal ${p.year}`, `year ${p.year}`] : [`is saal (${p.year})`, `this year (${p.year})`];

/* ---------- Monthly accountant ---------- */
/** Exact cash-flow accounting for a month; the market-value change needs prices and is returned separately. */
function monthReport(txs, ym, today, priceOn){
  const [y, m] = ym.split("-").map(Number); const from = `${ym}-01`; const to = endOfMonth(y, m) < today ? endOfMonth(y, m) : today; const before = addDays(from, -1);
  const r = { ym, from, to, deposits: 0, withdrawals: 0, bought: 0, sold: 0, fees: 0, dividends: 0, buys: 0, sells: 0, realized: 0, entries: 0 };
  for (const t of txs){ if (t.date < from || t.date > to) continue; r.entries++;
    if (t.type === "DEPOSIT") r.deposits += t.amount; if (t.type === "WITHDRAWAL") r.withdrawals += t.amount; if (t.type === "DIVIDEND") r.dividends += t.amount;
    if (t.type === "BUY"){ r.bought += t.qty * t.price + t.fees; r.fees += t.fees; r.buys++; } if (t.type === "SELL"){ r.sold += t.qty * t.price - t.fees; r.fees += t.fees; r.sells++; } if (t.type === "FEE") r.fees += t.amount; }
  const all = replay(txs); r.realized = round2(all.events.filter(e => e.date >= from && e.date <= to).reduce((a, e) => a + e.pl, 0));
  const A = replay(txs, before), B = replay(txs, to);
  r.startCash = round2(A.cash); r.endCash = round2(B.cash);
  const mv = (L, d) => { let v = 0, missing = 0; for (const [sym, p] of L.pos){ if (p.q <= 0) continue; const px = priceOn ? priceOn(sym, d) : null; if (px == null){ missing++; v += p.cost; } else v += p.q * px; } return { v, missing }; };
  const s0 = mv(A, before), s1 = mv(B, to);
  r.startValue = round2(s0.v + A.cash); r.endValue = round2(s1.v + B.cash); r.missingPrices = s0.missing + s1.missing;
  r.netNewMoney = round2(r.deposits - r.withdrawals); r.netInvested = round2(r.bought - r.sold);
  // Gain for the month = change in (holdings + cash) not explained by money you added or took out.
  r.marketGain = round2(r.endValue - r.startValue - r.netNewMoney);
  ["deposits","withdrawals","bought","sold","fees","dividends"].forEach(k => r[k] = round2(r[k]));
  return r;
}

/* ---------- Broker statement ---------- */
/** Reads "SYMBOL  1,200" style lines and a cash/balance line from pasted statement text. */
function parseStatementText(text){
  const holdings = []; let cash = null; const seen = new Set();
  for (const line0 of String(text || "").split(/\r?\n/)){
    const line = line0.trim(); if (!line) continue; const low = line.toLowerCase();
    if (/(cash|ledger|balance|available|net balance)/.test(low) && cash === null){ const m = line.replace(/,/g, "").match(/(-?\d+(?:\.\d+)?)\s*(?:cr|dr)?\s*$/i) || line.replace(/,/g, "").match(/(-?\d+(?:\.\d+)?)/); if (m){ cash = parseFloat(m[1]); if (/\bdr\b/i.test(line)) cash = -Math.abs(cash); continue; } }
    const tick = (line.match(/\b[A-Z][A-Z0-9]{1,7}\b/) || [])[0];
    const sym = tick && SYM[tick] ? tick : findSymbols(line).known[0] || null;
    if (!sym || seen.has(sym)) continue;
    const nums = line.replace(new RegExp(`\\b${sym}\\b`), " ").replace(/(\d),(?=\d{3})/g, "$1").match(/\d+(?:\.\d+)?/g) || [];
    const ints = nums.map(Number).filter(n => Number.isInteger(n) && n > 0);
    if (!ints.length) continue;
    holdings.push({ symbol: sym, qty: ints[0] }); seen.add(sym);
  }
  return { holdings, cash };
}
/**
 * Compares the ledger (as of the statement date) with the broker's numbers and explains likely causes.
 * broker = { qty: {SYM: n}, cash: number|null }, divRecords = unreceived dividend records (for cash hints).
 */
function reconcile(txs, asOf, broker, extras){
  const L = replay(txs, asOf); const syms = new Set([...[...L.pos.entries()].filter(([, p]) => p.q > 0).map(([k]) => k), ...Object.keys(broker.qty || {})]);
  const rows = [...syms].sort().map(sym => { const ours = L.pos.get(sym)?.q || 0; const has = broker.qty && Object.prototype.hasOwnProperty.call(broker.qty, sym) && broker.qty[sym] !== "" && broker.qty[sym] != null; const theirs = has ? Number(broker.qty[sym]) : null; const diff = has ? theirs - ours : null;
    let cause = null; if (diff > 0) cause = ours === 0 ? "missingBuy" : "moreAtBroker"; else if (diff < 0) cause = theirs === 0 ? "soldAtBroker" : "lessAtBroker";
    return { symbol: sym, ours, theirs, diff, cause, status: !has ? "unchecked" : diff === 0 ? "match" : "diff" }; });
  const cash = { ours: round2(L.cash), theirs: broker.cash == null || broker.cash === "" ? null : Number(broker.cash) };
  cash.diff = cash.theirs == null ? null : round2(cash.theirs - cash.ours); cash.status = cash.theirs == null ? "unchecked" : Math.abs(cash.diff) < 1 ? "match" : "diff"; cash.hints = [];
  if (cash.status === "diff"){
    for (const d of (extras?.divRecords || [])){ const net = round2(d.dps * d.qty * (1 - (extras.taxPct || 0) / 100)); if (Math.abs(net - cash.diff) <= Math.max(1, net * 0.01)) cash.hints.push({ kind: "dividend", symbol: d.symbol, amount: net, id: d.id }); }
    const lastFees = sortTx(txs).filter(t => t.date <= asOf && t.fees > 0).slice(-20); const feeSum = round2(lastFees.reduce((a, t) => a + t.fees, 0));
    if (cash.diff < 0 && Math.abs(Math.abs(cash.diff) - feeSum) <= 1) cash.hints.push({ kind: "fees", amount: feeSum });
    cash.hints.push({ kind: cash.diff > 0 ? "deposit" : "withdrawal", amount: Math.abs(cash.diff) });
  }
  const checked = rows.filter(r => r.status !== "unchecked").length + (cash.status !== "unchecked" ? 1 : 0);
  const diffs = rows.filter(r => r.status === "diff").length + (cash.status === "diff" ? 1 : 0);
  return { asOf, rows, cash, checked, diffs, allMatch: checked > 0 && diffs === 0 };
}

function monthlyAccount(){
  const m = new Map();
  for (const t of S.txs){
    const k = t.date.slice(0,7); const r = m.get(k) || {k, bought:0, sold:0, div:0, added:0, out:0, fees:0};
    if (t.type === "BUY"){ r.bought += t.qty*t.price + t.fees; r.fees += t.fees; }
    if (t.type === "SELL"){ r.sold += t.qty*t.price - t.fees; r.fees += t.fees; }
    if (t.type === "DIVIDEND") r.div += t.amount;
    if (t.type === "DEPOSIT") r.added += t.amount;
    if (t.type === "WITHDRAWAL") r.out += t.amount;
    m.set(k, r);
  }
  return [...m.values()].sort((a,b) => a.k < b.k ? 1 : -1);
}

  const month = t0.slice(0,7); const inv = S.txs.filter(t => t.type === "BUY" && t.date.startsWith(month)).reduce((a,t)=>a+t.qty*t.price+t.fees,0);

  return tasks.slice(0,6);
}

/** Value of what was held each day (holdings as of that day × that day's demo close), last `n` trading days. */
function portfolioSeries(n){
  const out = []; const k = Math.min(n, DAYS.length);
  for (let i = DAYS.length - k; i < DAYS.length; i++){
    const d = DAYS[i]; let v = 0;
    for (const [s, p] of replay(S.txs, d).pos){ if (p.q > 0){ const c = closeOn(s, d); v += c != null ? p.q * c : p.cost; } }
    out.push(v);
  }
  return out;
}
/** Area sparkline. `stroke` and `fill` are CSS colours; width scales to the container. */
function sparkSVG(vals, { w = 600, h = 64, stroke, fill, cls = "", dot = true } = {}){
  if (!vals || vals.length < 2) return "";
  const mn = Math.min(...vals), mx = Math.max(...vals), pad = 4;
  const pts = vals.map((v, i) => [i / (vals.length - 1) * w, h - pad - (v - mn) / ((mx - mn) || 1) * (h - pad * 2)]);
  const d = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
  const id = "g" + Math.random().toString(36).slice(2, 8); const last = pts[pts.length - 1];
  return `<svg class="${cls}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${fill}" stop-opacity=".28"/><stop offset="1" stop-color="${fill}" stop-opacity="0"/></linearGradient></defs><path d="${d} L ${w} ${h} L 0 ${h} Z" fill="url(#${id})"/><path d="${d}" fill="none" stroke="${stroke}" stroke-width="1.75" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/>${dot ? `<circle cx="${last[0]}" cy="${last[1]}" r="3" fill="${stroke}" vector-effect="non-scaling-stroke"/>` : ""}</svg>`;
}

/** One row per day something happened (a trade, or new prices): profit made that day vs the previous such day. */
function dailyEarnings(){

  const tradeDays = new Set(txs.filter(t => ["BUY","SELL","DIVIDEND","BONUS"].includes(t.type)).map(t => t.date));
  const priceDays = new Set(Object.keys(FAMILY ? (UI.fam.shared.log || {}) : {}));
  const days = [...new Set([...tradeDays, ...priceDays])].filter(d => d <= t0).sort();
  const out = []; let prev = null, prevPL = 0;
  for (const d of days){
    const r = plAt(txs, d); const L0 = replay(txs, d);
    const earn = r.pl - prevPL;
    const sold = L0.events.filter(e => e.date === d); const bought = txs.filter(t => t.type === "BUY" && t.date === d);
    const base = prev ? [...replay(txs, prev).pos.values()].reduce((a, p) => a + (p.q > 0 ? p.cost : 0), 0) : 0;
    if (Math.abs(earn) >= 0.5 || sold.length || bought.length) out.push({ d, prev, earn, pctv: base ? earn / base : null, sold, bought, booked: sold.reduce((a, e) => a + e.pl, 0) });
    prev = d; prevPL = r.pl;
  }
  return out.reverse();
}

function byShareTable(ev){

    const bq = b.reduce((a, t) => a + t.qty, 0) + tx.filter(t => t.type === "BONUS").reduce((a, t) => a + t.qty, 0);
    const bc = b.reduce((a, t) => a + t.qty * t.price + t.fees, 0);
    const sq = sl.reduce((a, t) => a + t.qty, 0), sv = sl.reduce((a, t) => a + t.qty * t.price - t.fees, 0);

const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition || null;
let recog = null;
function micErrText(k){
  return { denied: L("Mic ki ijazat nahi mili. Browser mein mic allow karein, ya phone ke keyboard ka 🎤 istemal karein.","Microphone permission wasn't given. Allow the mic in your browser, or use the 🎤 on your phone keyboard."),
    nospeech: L("Koi awaaz sunai nahi di. Mic dobara dabayein aur saaf bolein.","No speech was heard. Tap the mic again and speak clearly."),
    nomic: L("Is device par mic nahi mila.","No microphone was found on this device."),

function startMic(){
  const e = UI.entry; if (!SpeechRec || !e || e.listening) return;
  e.text = $("#voice-text")?.value ?? e.text ?? ""; e.error = null; e.micErr = null;
  const base = e.text.trim() ? e.text.trim() + " " : "";
  let r; try { r = new SpeechRec(); } catch { e.micErr = "other"; render(); return; }
  recog = r; r.lang = "en-IN"; r.interimResults = true; r.continuous = true; r.maxAlternatives = 1;
  let finalTxt = "";
  r.onresult = ev => { let interim = ""; for (let i = ev.resultIndex; i < ev.results.length; i++){ const x = ev.results[i]; if (x.isFinal) finalTxt += x[0].transcript + " "; else interim += x[0].transcript; }
    e.text = (base + finalTxt + interim).replace(/\s+/g, " ").trimStart(); const t = $("#voice-text"); if (t) t.value = e.text; };
  r.onerror = ev => { e.micErr = ev.error === "not-allowed" || ev.error === "service-not-allowed" ? "denied" : ev.error === "no-speech" ? "nospeech" : ev.error === "audio-capture" ? "nomic" : ev.error === "aborted" ? null : "other"; };
  r.onend = () => { if (recog === r) recog = null; e.listening = false; e.text = (e.text || "").trim(); if (UI.entry === e) render(); };
  e.listening = true; render();
  try { r.start(); } catch { recog = null; e.listening = false; e.micErr = "other"; render(); }
}
function stopMic(){ const r = recog; recog = null; try { r?.stop(); } catch {} if (UI.entry) UI.entry.listening = false; }

/* ---------------- Phone: WhatsApp text and calendar (.ics) reminders ---------------- */
const icsEsc = s => String(s || "").replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\r?\n/g, "\\n");
function icsFold(line){ const out = []; let s = line; while (s.length > 73){ out.push(s.slice(0, 73)); s = " " + s.slice(73); } out.push(s); return out.join("\r\n"); }
/** events: [{uid, date:"YYYY-MM-DD", time:"HHMM", title, desc?, rrule?}] — local (floating) time, a pop-up alarm at the start. */
function buildICS(events){
  const stamp = new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d+/, "");
  const L0 = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//PSX Personal Assistant//RU","CALSCALE:GREGORIAN","METHOD:PUBLISH"];
  for (const e of events){
    L0.push("BEGIN:VEVENT", `UID:${e.uid}@psx-personal-assistant`, `DTSTAMP:${stamp}`, `DTSTART:${e.date.replace(/-/g, "")}T${e.time}00`, "DURATION:PT15M", `SUMMARY:${icsEsc(e.title)}`);
    if (e.desc) L0.push(`DESCRIPTION:${icsEsc(e.desc)}`);
    if (e.rrule) L0.push(`RRULE:${e.rrule}`);
    L0.push("BEGIN:VALARM", "ACTION:DISPLAY", `DESCRIPTION:${icsEsc(e.title)}`, "TRIGGER:PT0M", "END:VALARM", "END:VEVENT");
  }
  L0.push("END:VCALENDAR"); return L0.map(icsFold).join("\r\n") + "\r\n";
}
const notifyTime = () => /^\d{2}:\d{2}$/.test(S.settings.notifyTime || "") ? S.settings.notifyTime : "09:00";
function dailyICS(){
  let d = todayISO(); const now = new Date(); const [hh, mm] = notifyTime().split(":").map(Number);
  if (now.getHours() * 60 + now.getMinutes() >= hh * 60 + mm) d = addDays(d, 1);
  while ([0, 6].includes(new Date(d + "T00:00:00").getDay())) d = addDays(d, 1);
  return buildICS([{ uid: "daily-update", date: d, time: notifyTime().replace(":", ""), rrule: "FREQ=WEEKLY;BYDAY=MO,TU,WE,TH,FR",
    title: L("PSX: aaj ki update dekhein","PSX: read today's update"), desc: L("PSX Personal Assistant kholein aur \"Meri Updates\" dekhein.","Open PSX Personal Assistant and read \"My Updates\".") }]);
}
function remindersICS(){
  const t0 = todayISO(); const RR = { weekly: "FREQ=WEEKLY", monthly: "FREQ=MONTHLY" };
  const list = S.reminders.filter(r => !r.done && r.date && !r.calAt);
  return { n: list.length, ics: buildICS(list.map(r => ({ uid: "rem-" + r.id, date: r.date < t0 ? t0 : r.date, time: notifyTime().replace(":", ""), rrule: RR[r.repeat] || null,
    title: "PSX: " + r.text, desc: L("PSX Personal Assistant ki yaad-dahani","Reminder from PSX Personal Assistant") }))) };
}
function dailyText(){
  const t0 = todayISO(); const items = dailyItems(t0); const tip = items.find(i => i.id === "tip");
  const lines = [`📈 PSX Personal Assistant · ${fmtDate(t0)}`, ""];
  items.filter(i => i.id !== "tip").forEach(i => lines.push(`• ${i.title}`));
  if (tip) lines.push("", `💡 ${tip.body}`);
  lines.push("", L("(Prices demo hain, announcements sample.)","(Prices are demo, announcements are sample.)"));
  return lines.join("\n");
}

function simpleSummary(d){

}

  const keep = old ? { src: old.src, by: old.by, demo: old.demo } : { src: "manual" };

function cleanExtracted(list, fallbackDate){
  return (Array.isArray(list) ? list : []).slice(0, 25).map(x => {
    const type = ["BUY","SELL","DIVIDEND","DEPOSIT","WITHDRAWAL","BONUS"].includes(String(x?.type).toUpperCase()) ? String(x.type).toUpperCase() : null;
    if (!type) return null;
    const sym = resolveSymbol(x.symbol || x.company || "");
    const n = v => typeof v === "number" && isFinite(v) ? v : typeof v === "string" && v.trim() !== "" && isFinite(parseNum(v)) ? parseNum(v) : "";
    const q = n(x.quantity); const date = validISO(x.date) && x.date <= todayISO() ? x.date : fallbackDate;
    return { type, symbol: sym, qty: q === "" ? "" : q, price: n(x.price), fees: n(x.fees), amount: n(x.amount), date, conf: ["high","medium","low"].includes(x.confidence) ? x.confidence : null };
  }).filter(Boolean);
}

async function shrinkImage(file){
  const max = UI.imgLimits?.maxBytes || 4.5e6;
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); });
  let w = img.naturalWidth, h = img.naturalHeight; const lim = 2000; if (Math.max(w,h) > lim){ const k = lim/Math.max(w,h); w = Math.round(w*k); h = Math.round(h*k); }
  if (file.size <= max && w === img.naturalWidth) return file;
  const c = document.createElement("canvas"); c.width = w; c.height = h; c.getContext("2d").drawImage(img, 0, 0, w, h);
  return await new Promise(r => c.toBlob(b => r(b || file), "image/jpeg", 0.9));
}

function posAsOf(sym, iso){ const p = replay(S.txs, iso).pos.get(sym); return { q: p?.q || 0, avg: p && p.q ? p.cost / p.q : 0 }; }
function eligibleQty(a){ const t = todayISO(); const asOf = a.bookFrom && a.bookFrom <= t ? addDays(a.bookFrom, -1) : t; return posAsOf(a.symbol, asOf); }

function tradingDayOnOrBefore(iso){ let best = null; for (const d of DAYS){ if (d <= iso) best = d; else break; } return best; }
function prevTradingDay(iso){ const i = DAYS.indexOf(iso); return i > 0 ? DAYS[i-1] : null; }
function dailyItems(date){
  const t0 = todayISO(); const items = [];
  const td = tradingDayOnOrBefore(date); const pd = td ? prevTradingDay(td) : null;
  const pos = replay(S.txs, date).pos; const held = [...pos.entries()].filter(([, p]) => p.q > 0).map(([s, p]) => ({ s, q: p.q, avg: p.cost / p.q }));
  const closed = td !== date;
  if (held.length && td && pd){
    let tot = 0, prevTot = 0; const moves = [];
    for (const h of held){ const c = closeOn(h.s, td), p = closeOn(h.s, pd); if (c == null || p == null) continue; tot += h.q * c; prevTot += h.q * p; moves.push({ ...h, c, p, ch: (c - p) / p, amt: (c - p) * h.q }); }
    const ch = tot - prevTot;
    items.push({ id: "sum", icon: ch >= 0 ? "trend" : "down", tone: ch >= 0 ? "g" : "r", demo: true,
      title: closed ? L(`Market band thi — aakhri din (${fmtDate(td)}) aap ka portfolio ${rsS(ch)} raha`, `Market was closed — on the last trading day (${fmtDate(td)}) your portfolio moved ${rsS(ch)}`) : L(`Aaj aap ka portfolio ${ch >= 0 ? "upar" : "neeche"} gaya: ${rsS(ch)} (${pct(prevTot ? ch / prevTot : 0, 2, true)})`, `Your portfolio moved ${rsS(ch)} (${pct(prevTot ? ch / prevTot : 0, 2, true)}) today`),
      body: L(`Kul value ${rs(tot)}. Prices demo hain.`, `Total value ${rs(tot)}. Prices are demo.`) });
    moves.sort((a, b) => Math.abs(b.ch) - Math.abs(a.ch)).filter(m => Math.abs(m.ch) >= 0.01).slice(0, 3).forEach(m => items.push({ id: `mv-${m.s}`, icon: m.ch >= 0 ? "trend" : "down", tone: m.ch >= 0 ? "g" : "r", demo: true, share: m.s,
      title: L(`${m.s} ${pct(Math.abs(m.ch),1)} ${m.ch >= 0 ? "upar" : "neeche"} gaya`, `${m.s} ${m.ch >= 0 ? "rose" : "fell"} ${pct(Math.abs(m.ch),1)}`),
      body: L(`Aap ke ${num(m.q)} shares ki value ${rsS(m.amt)} ${m.amt >= 0 ? "barhi" : "ghati"}. Aap ki average qeemat ${rs(m.avg,2)}, aaj ki qeemat ${rs(m.c,2)}.`, `Your ${num(m.q)} shares changed by ${rsS(m.amt)}. Your average is ${rs(m.avg,2)}, today's price ${rs(m.c,2)}.`) }));
  }
  const hs = new Set(held.map(h => h.s));
  allAnns().filter(a => hs.has(a.symbol) && a.date <= date && a.date >= addDays(date, -2)).forEach(a => items.push({ id: `an-${a.id}`, icon: KIND()[a.kind][2], tone: "b", sample: true, ann: a.id, title: annTitle(a), body: L(`Aap ke paas ${num(posAsOf(a.symbol, date).q)} ${a.symbol} shares hain. Tap kar ke aasaan zabaan mein samjhein.`, `You hold ${num(posAsOf(a.symbol, date).q)} ${a.symbol}. Tap to understand it in plain words.`) }));
  const upto = addDays(date, 7);
  const dates = [];
  allAnns().filter(a => hs.has(a.symbol)).forEach(a => {
    if (a.kind === "board" && a.meeting > date && a.meeting <= upto) dates.push({ k: `${a.id}-m`, d: a.meeting, s: a.symbol, what: L("board meeting","board meeting"), ann: a.id });
    if (a.bookFrom && a.bookFrom > date && a.bookFrom <= upto) dates.push({ k: `${a.id}-b`, d: a.bookFrom, s: a.symbol, what: L("book closure shuru","book closure starts"), ann: a.id });
    if (a.payDate && a.payDate > date && a.payDate <= upto) dates.push({ k: `${a.id}-p`, d: a.payDate, s: a.symbol, what: L("dividend payment","dividend payment"), ann: a.id });
    if (a.subEnd && a.subEnd > date && a.subEnd <= upto) dates.push({ k: `${a.id}-r`, d: a.subEnd, s: a.symbol, what: L("right shares ki aakhri tareekh","last date for right shares"), ann: a.id });
  });
  S.divRecords.filter(r => r.status !== "received").forEach(r => { if (r.book && r.book > date && r.book <= upto && !dates.some(x => x.s === r.symbol && x.d === r.book)) dates.push({ k: `dv-${r.id}-b`, d: r.book, s: r.symbol, what: L("book closure (aap ka record)","book closure (your record)") }); });
  dates.sort((a, b) => a.d < b.d ? -1 : 1).slice(0, 4).forEach(x => items.push({ id: `up-${x.k}`, icon: "cal", tone: "y", sample: !!x.ann, ann: x.ann, date: x.d,
    title: L(`${x.s}: ${x.what} ${relDay(x.d).toLowerCase()} (${fmtDate(x.d)})`, `${x.s}: ${x.what} ${relDay(x.d).toLowerCase()} (${fmtDate(x.d)})`), body: L("Chahein to yaad-dahani laga lein.","Set a reminder if you like."), remind: { text: `${x.s}: ${x.what}`, date: addDays(x.d, -1), symbol: x.s } }));

  const tips = TIPS(); const di = Math.abs(dayDiff(date, "2026-01-01")) % tips.length;
  items.push({ id: "tip", icon: "spark", tone: "b", title: L("Aaj ki seekhne wali baat","Today's learning"), body: tips[di] });
  return items;
}

function uDividend(){
  const t0 = todayISO(); const tax = S.settings.divTaxPct; const held = heldNow();
  const recs = S.divRecords; const ledgerDiv = S.txs.filter(t => t.type === "DIVIDEND");
  const upcoming = recs.filter(r => r.status !== "received").sort((a, b) => (a.book || "9") < (b.book || "9") ? -1 : 1);
  const upNet = upcoming.reduce((a, r) => a + r.dps * r.qty * (1 - tax/100), 0);
  const fy = fyOf(t0); const thisFY = ledgerDiv.filter(t => fyOf(t.date) === fy).reduce((a, t) => a + t.amount, 0);
  const allTime = ledgerDiv.reduce((a, t) => a + t.amount, 0);
  const recorded = new Set(recs.map(r => r.annId).filter(Boolean));
  const suggest = allAnns().filter(a => a.kind === "dividend" && held.has(a.symbol) && !recorded.has(a.id) && a.payDate >= addDays(t0, -10));
  const per = {}; ledgerDiv.forEach(t => { const p = per[t.symbol] ||= { s: t.symbol, total: 0, last: "", n: 0 }; p.total += t.amount; p.n++; if (t.date > p.last) p.last = t.date; });
  const sn = snap(); const costOf = s => sn.holdings.find(h => h.s === s)?.cost || 0;
  const months = []; for (let k = -11; k <= 2; k++){ const d = new Date(t0 + "T00:00:00"); d.setDate(1); d.setMonth(d.getMonth() + k); months.push(`${d.getFullYear()}-${pad2(d.getMonth()+1)}`); }
  const mv = months.map(m => ({ m, got: ledgerDiv.filter(t => t.date.startsWith(m)).reduce((a, t) => a + t.amount, 0), exp: upcoming.filter(r => (r.pay || r.book || "").startsWith(m)).reduce((a, r) => a + r.dps * r.qty * (1 - tax/100), 0) }));
  const mx = Math.max(1, ...mv.map(x => x.got + x.exp));
  const ST = { expected: [L("Mera andaaza","My estimate"), "soft"], declared: [L("Elaan ho chuka","Declared"), "info"], received: [L("Mil gaya","Received"), "ok"] };
  return `<div class="grid3">
    <div class="card pad"><div class="lbl">${L("Aane wala dividend (andaazan)","Coming dividend (est.)")}</div><div class="num" style="font-size:22px;font-weight:620">${rs(upNet)}</div><div class="tiny faint">${L(`tax ${tax}% ke baad`, `after ${tax}% tax`)}</div></div>
    <div class="card pad"><div class="lbl">${L(`Is tax saal mila (${fy})`, `Received this tax year (${fy})`)}</div><div class="num gain" style="font-size:22px;font-weight:620">${rs(thisFY)}</div><div class="tiny faint">${L("1 July se ab tak","since 1 July")}</div></div>
    <div class="card pad"><div class="lbl">${L("Ab tak kul mila","Received all time")}</div><div class="num" style="font-size:22px;font-weight:620">${rs(allTime)}</div><div class="tiny faint">${L(`${ledgerDiv.length} dividend entries`, `${ledgerDiv.length} dividend entries`)}</div></div>
  </div>

  <section class="card pad stack">
    <div class="row" style="justify-content:space-between;flex-wrap:wrap"><h2 class="h-sec">${L("Mujhe kaunsa dividend aane wala hai?","Which dividends are coming to me?")}</h2><button class="btn sm primary" data-act="div-new">${ic("plus",15)} ${L("Record banayein","Add record")}</button></div>
    ${upcoming.length ? upcoming.map(r => { const net = r.dps * r.qty * (1 - tax/100); const pos = r.book && r.book <= t0 ? posAsOf(r.symbol, addDays(r.book, -1)) : posAsOf(r.symbol, t0); const mismatch = pos.q !== r.qty;
      return `<div class="task" style="box-shadow:none">
        <div class="logo">${logoMark(r.symbol)}</div>
        <div style="flex:1;min-width:0">
          <div class="row" style="gap:6px;flex-wrap:wrap"><b>${esc(r.symbol)}</b><span class="pill ${ST[r.status][1]}">${ST[r.status][0]}</span>${r.sample ? SAMPLE_PILL() : ""}${r.demo ? `<span class="pill soft">Demo</span>` : ""}</div>
          <p class="small muted num">Rs ${num(r.dps,2)} × ${num(r.qty)} ${L("shares","shares")} = ${rs(r.dps*r.qty)} · ${L("tax ke baad","after tax")} <b style="color:var(--ink)">${rs(net)}</b></p>
          <p class="small muted">${r.book ? `${L("Book closure","Book closure")}: ${fmtDate(r.book)} (${relDay(r.book)})` : L("Book closure abhi maloom nahi","Book closure not known yet")}${r.pay ? ` · ${L("Payment","Payment")}: ${fmtDate(r.pay)}` : ""}</p>
          ${mismatch ? `<div class="notice gold" style="padding:8px 10px;margin-top:6px">${ic("alert",16)}<div class="small">${r.book && r.book <= t0 ? L(`Book closure se pehle aap ke paas ${num(pos.q)} shares the, record mein ${num(r.qty)} hain.`, `You held ${num(pos.q)} before book closure; the record says ${num(r.qty)}.`) : L(`Abhi aap ke paas ${num(pos.q)} shares hain, record mein ${num(r.qty)}.`, `You hold ${num(pos.q)} now; the record says ${num(r.qty)}.`)} <button class="link" data-act="div-fixqty" data-id="${r.id}" data-v="${pos.q}">${L(`${num(pos.q)} kar dein`, `Set to ${num(pos.q)}`)}</button></div></div>` : ""}
          <div class="acts"><button class="btn sm primary" data-act="div-receive" data-id="${r.id}">${ic("check",15,2.4)} ${L("Mil gaya","Received")}</button>${r.book && r.book > t0 ? `<button class="btn sm ghost" data-act="rem-quick" data-text="${esc(`${r.symbol}: book closure ${fmtDate(r.book)} — shares CDC mein check karein`)}" data-date="${addDays(r.book,-3) < t0 ? t0 : addDays(r.book,-3)}" data-s="${r.symbol}">${ic("bell",15)} ${L("Yaad dilayein","Remind me")}</button>` : ""}<button class="btn sm ghost" data-act="div-edit" data-id="${r.id}">${ic("edit",15)} ${L("Badlein","Edit")}</button><button class="btn sm ghost" data-act="div-del" data-id="${r.id}" aria-label="${L("Mitayein","Delete")}">${ic("trash",15)}</button></div>
        </div></div>`; }).join("") : `<div class="empty">${L("Abhi koi aane wala dividend record nahi.","No upcoming dividend records.")}</div>`}
  </section>

  ${suggest.length ? `<section class="card pad stack"><div class="row" style="gap:8px;flex-wrap:wrap"><h2 class="h-sec">${L("Aap ke shares ke dividend announcements","Dividend announcements for your shares")}</h2>${SAMPLE_PILL()}</div>
    <p class="small muted">${L("Yeh sample announcements hain. Asli feed lagne ke baad yahan asli elaan aayenge.","These are sample announcements. Real ones will appear after a live feed is connected.")}</p>
    ${suggest.map(a => { const e = eligibleQty(a); const m = corporateMath(a, e.q, e.avg, quote(a.symbol)?.price, tax); return `<div class="li"><div class="logo">${logoMark(a.symbol)}</div><div class="mid"><div class="main-t">${esc(annTitle(a))}</div><div class="sub-t">${L("Book closure","Book closure")} ${fmtDate(a.bookFrom)} · ${L("aap ko","you get")} ~${rs(m.net)}</div></div><div class="right" style="display:flex;gap:6px;flex-direction:column;align-items:flex-end"><button class="btn sm primary" data-act="div-from-ann" data-v="${a.id}">${L("Record banayein","Add record")}</button><button class="link" data-act="ann-open" data-v="${a.id}">${L("Samjhao","Explain")}</button></div></div>`; }).join("")}</section>` : ""}

  <section class="card pad stack"><h2 class="h-sec">${L("Har mahine kitna dividend aaya?","Dividend by month")}</h2>
    <div class="mbars" role="img" aria-label="${L("Mahana dividend","Monthly dividend")}">${mv.map(x => `<div class="c" title="${fmtMonth(x.m)}: ${rs(x.got)}${x.exp ? " + " + rs(x.exp) + " " + L("andaazan","est.") : ""}"><div style="width:100%;max-width:30px;display:flex;flex-direction:column;justify-content:flex-end;height:100px">${x.exp ? `<div class="b" style="height:${Math.max(3,x.exp/mx*96)}px;background:color-mix(in srgb,var(--emerald) 35%,transparent);border-radius:8px 8px 0 0"></div>` : ""}<div class="b" style="height:${x.got ? Math.max(3,x.got/mx*96) : 0}px;${x.exp ? "border-radius:0 0 4px 4px" : ""}"></div></div><div class="m">${MONTHS_EN[Number(x.m.slice(5))-1].slice(0,1)}</div></div>`).join("")}</div>
    <div class="row tiny faint" style="gap:14px"><span class="row" style="gap:6px"><i style="width:12px;height:12px;border-radius:3px;background:var(--emerald);display:inline-block"></i>${L("Mil chuka","Received")}</span><span class="row" style="gap:6px"><i style="width:12px;height:12px;border-radius:3px;background:color-mix(in srgb,var(--emerald) 35%,transparent);display:inline-block"></i>${L("Aane wala (andaazan)","Coming (est.)")}</span></div>
  </section>

  <section class="card pad stack"><h2 class="h-sec">${L("Kis company se kitna mila?","How much from each company?")}</h2>
    ${Object.values(per).length ? `<div class="scroll-x"><table class="t num"><thead><tr><th>${L("Company","Company")}</th><th class="r">${L("Kul mila","Total")}</th><th class="r">${L("Kitni dafa","Times")}</th><th class="r">${L("Aakhri dafa","Last")}</th><th class="r">${L("Lagaye paise par","On money invested")}</th></tr></thead><tbody>${Object.values(per).sort((a, b) => b.total - a.total).map(p => `<tr><td><b>${esc(p.s)}</b></td><td class="r gain">${rs(p.total)}</td><td class="r">${p.n}</td><td class="r">${fmtDate(p.last)}</td><td class="r">${costOf(p.s) ? pct(p.total / costOf(p.s), 1) : "—"}</td></tr>`).join("")}</tbody></table></div>` : `<p class="muted small">${L("Abhi koi dividend nahi mila.","No dividends received yet.")}</p>`}
  </section>

  <section class="card pad stack"><h2 class="h-sec">${L("Dividend kaise milta hai?","How does a dividend reach me?")}</h2>
    ${[[L("Elaan","Announcement"), L("Company batati hai ke fi share kitna dega (jaise Rs 5).","The company says how much per share (e.g. Rs 5).")], [L("Book closure","Book closure"), L("Is tareekh se pehle shares aap ke CDC account mein hone chahiye. Khareed ki aakhri tareekh broker se confirm karein.","Shares must be in your CDC account before this date. Confirm the last buying date with your broker.")], [L("Tax katta hai","Tax is deducted"), L(`Company tax kaat kar deti hai. Aap ka rate (${tax}%) Settings mein badal sakte hain — filer aur non-filer ka rate alag hota hai.`, `The company deducts tax. Your rate (${tax}%) can be changed in Settings — filer and non-filer rates differ.`)], [L("Paise aate hain","Money arrives"), L("Payment ki tareekh tak bank ya broker account mein. Phir yahan \"Mil gaya\" dabayein.","By the payment date in your bank or broker account. Then tap \"Received\" here.")]].map(([h, b], i) => `<div class="row" style="align-items:flex-start;gap:12px"><span class="logo" style="width:32px;height:32px;border-radius:10px;font-size:13px">${i+1}</span><div><b>${esc(h)}</b><p class="small muted">${esc(b)}</p></div></div>`).join("")}
  </section>`;
}

  allAnns().filter(a => held.has(a.symbol)).forEach(a => {
    if (a.kind === "board" && a.meeting >= t0) dates.push({ d: a.meeting, s: a.symbol, w: L("Board meeting","Board meeting"), ann: a.id });
    if (a.bookFrom && a.bookFrom >= t0) dates.push({ d: a.bookFrom, s: a.symbol, w: L("Book closure shuru","Book closure starts"), ann: a.id });
    if (a.payDate && a.payDate >= t0) dates.push({ d: a.payDate, s: a.symbol, w: L("Dividend payment","Dividend payment"), ann: a.id });

function taxReport(){

  const sales = sn.events.filter(e => inFy(e.date));
  const firstBuy = {}; sortTx(S.txs).forEach(t => { if (t.type === "BUY" && !firstBuy[t.symbol]) firstBuy[t.symbol] = t.date; });
  const divs = S.txs.filter(t => t.type === "DIVIDEND" && inFy(t.date));

function sparkline(vals){
  if (vals.length < 2) return "";
  const w = 320, h = 70, mn = Math.min(...vals), mx = Math.max(...vals);
  const pts = vals.map((v,i) => [i/(vals.length-1)*w, h - 6 - (v-mn)/((mx-mn)||1)*(h-12)]);
  const up = vals[vals.length-1] >= vals[0]; const col = up ? "var(--emerald)" : "var(--loss)";
  const d = pts.map((p,i) => (i?"L":"M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none" aria-hidden="true"><path d="${d} L ${w} ${h} L 0 ${h} Z" fill="${col}" opacity=".12"/><path d="${d}" fill="none" stroke="${col}" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/><circle cx="${pts[pts.length-1][0]}" cy="${pts[pts.length-1][1]}" r="3.5" fill="${col}"/></svg>`;
}

}

function aiErr(e){
  const c = e?.code;
  if (c === "not_granted") return L("Aap ne Claude istemal ki ijazat nahi di. Dobara koshish karein to ijazat maangi jayegi.","Permission to use Claude wasn't given. Try again to be asked.");
  if (c === "rate_limited") return L("Abhi bohat zyada requests hain. Thori dair baad koshish karein.","Too many requests right now. Try again shortly.");
  if (c === "invalid_json") return L("Tasveer se saaf details nahi mil sakin. Details khud bhar dein.","Couldn't read clear details from the picture. Please fill them in.");
  if (c === "image_rejected") return L("Yeh tasveer qabool nahi hui. PNG ya JPG screenshot try karein.","This picture wasn't accepted. Try a PNG or JPG screenshot.");
  return L("Abhi jawab nahi mil saka. Thori dair baad koshish karein.","Couldn't get an answer right now. Please try again later.");
}

const AI_RULES = () => `You help an ordinary Pakistani retail investor (not a professional). Reply in ${S.lang === "en" ? "plain, simple English" : "natural, conversational Roman Urdu (Urdu written in English letters); keep words like Portfolio, Profit, Dividend, Shares in English"}. Keep it short and friendly: at most 8 short lines, no markdown headings, no tables, use simple dashes for lists. Never invent prices, company news, dividends or Shariah status. Never tell the user to buy or sell a specific share; you may explain risks and what to check. If information is missing, say so.`;
async function runAI(tool, prompt, opts={}){
  const A = UI.ai[tool] = {...(UI.ai[tool]||{}), busy:true, error:null, answer:null, live:""}; render();
  try {
    const r = await UI.sample(prompt, { ...opts, onText: ({text}) => { A.live = text; const el = $("#chat-live"); if (el) el.textContent = text; } });
    A.answer = r.text; A.busy = false; return r.text;
  } catch (e){ A.error = aiErr(e); A.busy = false; return null; }
  finally { render(); }
}

function monthsWithData(){ const set = new Set(S.txs.map(t => t.date.slice(0, 7))); set.add(todayISO().slice(0, 7)); return [...set].sort(); }
/** Pieces of the Monthly account that depend on the goal; redrawn live while the goal slider moves. */
function moGoalParts(goal, ym){
  const ms = monthsWithData(); const reps = ms.map(m => monthReport(S.txs, m, todayISO(), null));
  const r = reps[ms.indexOf(ym)] || { bought: 0 };
  let streak = 0; for (let k = reps.length - 1; k >= 0; k--){ if (goal > 0 && reps[k].bought >= goal) streak++; else if (k === reps.length - 1) continue; else break; }
  const last12 = reps.slice(-12); const mx = Math.max(1, goal, ...last12.map(x => x.bought));
  const hit = last12.filter(x => goal > 0 && x.bought >= goal).length;
  const pctDone = goal > 0 ? Math.min(100, r.bought / goal * 100) : 0;
  const status = goal <= 0 ? "Set a goal with the slider, or type an amount."
    : r.bought >= goal ? `Goal met in ${fmtMonth(ym)}: ${rs(r.bought)} invested. Well done!`
    : `${rs(r.bought)} invested in ${fmtMonth(ym)}, ${rs(goal - r.bought)} to go.`;
  const live = `<div class="mg-prog"><div class="bar"><i style="width:${pctDone.toFixed(1)}%"></i></div><b class="num">${goal > 0 ? Math.round(pctDone) + "%" : "—"}</b></div>
    <div class="row" style="justify-content:space-between;gap:8px;flex-wrap:wrap"><p class="small muted" style="margin:0">${status}</p>
    <span class="row" style="gap:6px">${streak ? `<span class="pill ok">${streak} month streak</span>` : ""}${goal > 0 ? `<span class="pill info">Met in ${hit} of last ${last12.length}</span>` : ""}</span></div>`;
  const bars = `${goal > 0 ? `<div class="mg-line" style="bottom:${20 + goal / mx * 100}px"><span>Goal ${rs(goal)}</span></div>` : ""}${last12.map(x => `<button class="c${goal > 0 && x.bought >= goal ? " hit" : ""}" style="background:none" data-act="mo-pick" data-v="${x.ym}" title="${fmtMonth(x.ym)}: ${rs(x.bought)}"><div class="b" style="height:${Math.max(3, x.bought / mx * 100)}px;${x.ym === ym ? "outline:2px solid var(--ink-2);outline-offset:2px" : ""}"></div><div class="m" style="${x.ym === ym ? "color:var(--ink);font-weight:620" : ""}">${MONTHS_EN[+x.ym.slice(5) - 1].slice(0,3)}</div></button>`).join("")}`;
  return { live, bars, maxBought: Math.max(0, ...reps.map(x => x.bought)) };
}
function moGoalLive(goal){
  const ym = document.getElementById("mo-goal")?.dataset.ym; if (!ym) return;
  const g = moGoalParts(goal, ym);
  $("#mg-live").innerHTML = g.live; $("#mg-bars").innerHTML = g.bars; $("#mg-val").textContent = goal > 0 ? rs(goal) : "No goal";
  const rg = $("#mg-range"); if (rg){ if (goal > +rg.max) rg.max = Math.ceil(goal / 10000) * 10000; rg.style.setProperty("--fill", `${Math.min(100, goal / +rg.max * 100)}%`); }
}

/* ---------------- PDF reports ---------------- */
let jsPdfLoad = null;
function loadScript(src){ return new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = () => rej(new Error("load")); document.head.appendChild(s); }); }
async function getJsPDF(){
  if (window.jspdf?.jsPDF?.API?.autoTable) return window.jspdf.jsPDF;
  jsPdfLoad ||= loadScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js").then(() => loadScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"));
  try { await jsPdfLoad; } catch (e){ jsPdfLoad = null; throw e; }
  return window.jspdf.jsPDF;
}
const pdfSafe = t => String(t ?? "").replace(/−/g, "-").replace(/→/g, "->").replace(/[·•]/g, "-").replace(/×/g, "x").replace(/÷/g, "/").replace(/[“”]/g, '"').replace(/[‘’]/g, "'").replace(/—/g, "-").replace(/…/g, "...").replace(/[^\x09\x0A\x0D\x20-\x7E\xA0-\xFF]/g, "");
/** spec = { title, subtitle, sections: [{ heading, text?: string[], kv?: [[k, v]], table?: { head: [], rows: [[]] } }] } */
async function exportPdf(spec, filename){
  let jsPDF; toast(L("PDF ban rahi hai…","Making the PDF…"));
  try { jsPDF = await getJsPDF(); } catch { toast(L("PDF banane wali library load nahi ho saki. Internet check kar ke dobara koshish karein.","Couldn't load the PDF library. Check your connection and try again.")); return; }
  const doc = new jsPDF({ unit: "pt", format: "a4" }); const W = doc.internal.pageSize.getWidth(); const M = 40; let y = 0;
  doc.setFillColor(11, 31, 63); doc.rect(0, 0, W, 76, "F");
  doc.setTextColor(255, 255, 255); doc.setFont("helvetica", "bold"); doc.setFontSize(16); doc.text("PSX Personal Assistant", M, 32);
  doc.setFont("helvetica", "normal"); doc.setFontSize(10); doc.text("Your shares. Our accounts.", M, 50); doc.text(pdfSafe(`${L("Banai gayi","Created")}: ${fmtDate(todayISO())}`), W - M, 50, { align: "right" });

    const d = new Date(); const dosT = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1); const dosD = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();

      ce.setUint32(0, 0x02014b50, true); ce.setUint16(4, 20, true); ce.setUint16(6, 20, true); ce.setUint16(8, 0x0800, true); ce.setUint16(10, 0, true); ce.setUint16(12, dosT, true); ce.setUint16(14, dosD, true);
      ce.setUint32(16, c, true); ce.setUint32(20, data.length, true); ce.setUint32(24, data.length, true); ce.setUint16(28, name.length, true); ce.setUint32(42, off, true);

  const holdings = [...Lend.pos.entries()].filter(([, p]) => p.q > 0).map(([s, p]) => { const px = priceOn(s, to); const value = px != null ? p.q * px : p.cost; return { s, q: p.q, avg: p.cost / p.q, cost: p.cost, px, value, pl: px != null ? value - p.cost : null, plPct: px != null && p.cost ? (value - p.cost) / p.cost : null }; }).sort((a, b) => b.value - a.value);
  const inP = all.filter(t => t.date >= from && t.date <= to);
  const sells = inP.filter(t => t.type === "SELL" && evAll[t.id]);
  const bySym = {};
  inP.forEach(t => { if (!t.symbol || !["BUY", "SELL", "BONUS", "DIVIDEND"].includes(t.type)) return; const r = bySym[t.symbol] ||= { s: t.symbol, bq: 0, bc: 0, sq: 0, sv: 0, pl: 0, removed: 0, div: 0 };
    if (t.type === "BUY"){ r.bq += t.qty; r.bc += t.qty * t.price + t.fees; } if (t.type === "BONUS") r.bq += t.qty;
    if (t.type === "SELL" && evAll[t.id]){ r.sq += t.qty; r.sv += t.qty * t.price - t.fees; r.pl += evAll[t.id].pl; r.removed += evAll[t.id].removed; }
    if (t.type === "DIVIDEND") r.div += t.amount; });
  const byShare = Object.values(bySym).map(r => ({ ...r, left: Lend.pos.get(r.s)?.q || 0 })).sort((a, b) => a.s < b.s ? -1 : 1);
  const daily = dailyEarnings().filter(x => x.d >= from && x.d <= to).reverse();
  const sum = k => inP.filter(t => t.type === k);
  const bought = sum("BUY").reduce((a, t) => a + t.qty * t.price + t.fees, 0), sold = sells.reduce((a, t) => a + t.qty * t.price - t.fees, 0);
  const booked = sells.reduce((a, t) => a + evAll[t.id].pl, 0), dividends = sum("DIVIDEND").reduce((a, t) => a + t.amount, 0);
  const charges = inP.filter(t => t.type === "BUY" || t.type === "SELL").reduce((a, t) => a + (t.fees || 0), 0) + sum("FEE").reduce((a, t) => a + t.amount, 0);

  const periodPL = plOn(to) - (all[0] && from > all[0].date ? plOn(addDays(from, -1)) : 0);

}

/** Read share prices from pasted text (broker app via Live Text / Google Lens, a watchlist, or "OGDC 245.5" lines).
    For each known symbol, the price is the first plain number after it, skipping quantities ("53,710 shares"), averages ("@ 13.76"),
    volume, day low/high ("l: 12.25 h: 12.48"), signed changes, percentages and PKR amounts. */
function parsePastedPrices(text, symbols){
  const src = String(text || "").replace(/[−–—]/g, "-").replace(/ /g, " ");
  const set = new Set(symbols.map(x => x.toUpperCase()));
  const find = ci => { const out = []; const re = /[A-Za-z][A-Za-z0-9]{1,9}/g; let m;
    while ((m = re.exec(src))){ const w = m[0]; const before = src[m.index - 1] || " ", after = src[m.index + w.length] || " ";
      if (/[A-Za-z0-9]/.test(before) || /[A-Za-z0-9]/.test(after)) continue;
      const up = w.toUpperCase(); if (set.has(up) && (ci || w === up)) out.push({ s: up, at: m.index, end: m.index + w.length }); }
    return out; };
  let hits = find(false); if (!hits.length) hits = find(true);
  const res = {};
  hits.forEach((h, i) => {
    if (res[h.s]) return;
    const seg = src.slice(h.end, i + 1 < hits.length ? hits[i + 1].at : src.length);
    const re = /([+-]?)(\d{1,3}(?:,\d{3})+|\d+)(\.\d+)?(\s*%)?/g; let m;
    while ((m = re.exec(seg))){
      const pre = seg.slice(Math.max(0, m.index - 14), m.index), post = seg.slice(m.index + m[0].length, m.index + m[0].length + 10);
      if (m[1] || m[4]) continue;                                        // +0.13, -71,434.30, 1.06%
      if (/[(\d.,]$/.test(pre) || /\(\s*[:;]\s*$/.test(pre) || /^[\d]/.test(post)) continue;
      if (/@\s*$/.test(pre) || /shares?\s*@?\s*$/i.test(pre)) continue; // average price
      if (/vol(ume)?\s*[:.]?\s*$/i.test(pre)) continue;                  // Mkt Vol: 9,171,773
      if (/(^|[^A-Za-z])[lhLHI1]\s*[:;]\s*$/.test(pre) || /(low|high)\s*[:.]?\s*$/i.test(pre)) continue; // l: 12.25 h: 12.48
      if (/(pkr|value|loss|profit|gain)\s*[:.]?\s*$/i.test(pre)) continue;
      if (/^\s*(shares?|sh\b|qty)/i.test(post)) continue;                // 53,710 shares
      const v = parseFloat((m[2] + (m[3] || "")).replace(/,/g, ""));
      if (!(v > 0 && v < 100000)) continue;
      res[h.s] = Math.round(v * 100) / 100; break;
    }
  });
  return res;
}

let OCR_LIB = null;
function loadOcr(){
  if (window.Tesseract) return Promise.resolve(window.Tesseract);
  return OCR_LIB ||= new Promise((res, rej) => { const sc = document.createElement("script"); sc.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"; sc.onload = () => res(window.Tesseract); sc.onerror = () => { OCR_LIB = null; rej(new Error("load")); }; document.head.appendChild(sc); });

async function shotCanvas(file){
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const k = Math.min(2, 2400 / img.naturalWidth); const c = document.createElement("canvas");

}

/** Total profit (unrealised + booked + dividends − charges entries) as of a date, using shared prices known on that date. */
function plAt(txs, iso){
  const L0 = replay(txs, iso); let unreal = 0, realized = 0, div = 0, bought = 0;
  for (const [s, p] of L0.pos){ realized += p.realized; div += p.div; bought += p.bought; if (p.q > 0){ const px = famPriceOn(s, iso); if (px != null) unreal += p.q * px - p.cost; } }
  const fee = txs.filter(t => t.type === "FEE" && t.date <= iso).reduce((a, t) => a + t.amount, 0);
  return { pl: unreal + realized + div - fee, bought };
}
