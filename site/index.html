  const monthPL = sn.totalPL - a.pl; const monthPct = sn.bought ? monthPL / sn.bought : 0;
  const best = [...sn.holdings].filter(h => h.userPrice).sort((x, y) => y.plPct - x.plPct)[0] || null;
  const yr = fyOf(t0); const divYear = txs.filter(t => t.type === "DIVIDEND" && fyOf(t.date) === yr).reduce((s, t) => s + t.amount, 0);
  return { id, sn, pct, monthPL, monthPct, dayPct: sn.dayPct, day: sn.day, best, divYear, entries: txs.length, hasData: txs.some(t => t.type === "BUY" || t.type === "BONUS") };
}
function raceSeries(){
  const dates = Object.keys(UI.fam.shared.log || {}).sort(); if (!dates.includes(todayISO())) dates.push(todayISO());
  return MEMBERS.map(m => { const txs = UI.fam.states[m.id]?.txs || []; return { id: m.id, pts: dates.map(d => { const r = plAt(txs, d); return r.bought ? r.pl / r.bought : null; }) }; }).concat([{ dates }]);
}
function raceChart(){
  const all = raceSeries(); const dates = all.pop().dates;
  if (dates.length < 2) return `<p class="small muted">${L("Ye chart tab banega jab do alag dinon ki qeematein darj ho jayengi. Har kuch din baad Portfolio → Prices mein qeematein daalte rahein.","This chart appears once prices have been entered on two different days. Keep adding prices in Portfolio → Prices every few days.")}</p>`;
  const W = 640, H = 230, pl = 52, pr = 12, pt = 14, pb = 30;
  const vals = all.flatMap(s => s.pts).filter(v => v != null); let mn = Math.min(0, ...vals), mx = Math.max(0, ...vals); if (mx - mn < .02){ mx += .01; mn -= .01; }
  const t0d = Date.parse(dates[0]), span = Math.max(1, Date.parse(dates[dates.length - 1]) - t0d);
  const x = i => pl + (Date.parse(dates[i]) - t0d) / span * (W - pl - pr); const y = v => pt + (mx - v) / (mx - mn) * (H - pt - pb);
  const ticks = [mn, (mn + mx) / 2, mx, 0].filter((v, i, a) => a.findIndex(w => Math.abs(w - v) < 1e-9) === i);
  const grid = ticks.map(v => `<line x1="${pl}" x2="${W - pr}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="var(--line${v === 0 ? "-2" : ""})" ${v === 0 ? "" : 'stroke-dasharray="3 4"'}/><text x="${pl - 6}" y="${(y(v) + 4).toFixed(1)}" text-anchor="end" font-size="13" fill="var(--ink-3)">${pct(v, 0, true)}</text>`).join("");
  const xl = [0, dates.length - 1].map(i => `<text x="${x(i).toFixed(1)}" y="${H - 6}" text-anchor="${i ? "end" : "start"}" font-size="13" fill="var(--ink-3)">${fmtDate(dates[i])}</text>`).join("");
  const lines = all.map(s => { const pts = s.pts.map((v, i) => v == null ? null : [x(i), y(v)]).filter(Boolean); if (pts.length < 1) return "";
    const col = `hsl(${MEM[s.id].hue} 70% 62%)`; const last = pts[pts.length - 1];
    return `<path d="${pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ")}" fill="none" stroke="${col}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="4" fill="${col}"/>`; }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${L("Teeno ka munafa % waqt ke saath","Everyone's return over time")}" style="display:block;max-width:100%">${grid}${xl}${lines}</svg>
    <div class="row" style="gap:16px;flex-wrap:wrap;margin-top:6px">${MEMBERS.map(m => `<span class="row tiny" style="gap:6px"><i style="width:14px;height:3px;border-radius:2px;background:hsl(${m.hue} 70% 62%);display:inline-block"></i>${esc(m.name)}</span>`).join("")}</div>`;
}

/* ---------- screens ---------- */
function famKeyFrom(t){ t = String(t || "").trim(); const m = t.match(/[?&#]k=([A-Za-z0-9_-]{16,})/); if (m) return m[1]; return /^[A-Za-z0-9_-]{16,}$/.test(t) ? t : null; }
function famUseKey(raw){ const k = famKeyFrom(raw); const err = $("#fam-key-err"); if (!k){ if (err) err.textContent = "That doesn't look like the right link. Paste the full link."; return; } location.replace(location.pathname + "?k=" + encodeURIComponent(k)); }
function famGateView(){
  const s = UI.fam.status;
  const box = (icon, title, body, extra = "") => `<div class="card pad stack" style="max-width:520px;margin:8vh auto 0;text-align:center;align-items:center"><div class="quick-btn" style="padding:0;border:0;background:none"><span class="qi" style="width:56px;height:56px;border-radius:16px">${ic(icon,26)}</span></div><h1 class="h-page" style="font-size:30px">${title}</h1><p class="muted">${body}</p>${extra}</div>`;
  if (s === "loading") return box("clock", "Loading your portfolio…", L("Bas ek pal.","Just a moment."), `<span class="spin" style="color:var(--emerald)"></span>`);
  const keyForm = `<form class="stack gate-key" data-form="fam-key" novalidate style="width:100%;text-align:left;margin-top:6px">
      <label class="lbl" for="fam-key-in">Paste your link</label>
      <input class="input" id="fam-key-in" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="https://psx-pilot.netlify.app/?k=…">
      <span class="err" id="fam-key-err"></span>
      <div class="row" style="gap:8px"><button type="button" class="btn line" data-act="fam-key-paste">${ic("copy",16)} Paste</button><button type="submit" class="btn primary" style="flex:1">${ic("lock",16)} Open</button></div>
      <p class="tiny faint" style="margin:0">Only needed once on this phone. Opened from the home screen icon, the website keeps its own memory, so it needs the link one time too.</p></form>`;
  if (s === "nokey") return box("lock", "This is a private website", "Open it with your special link.", keyForm);
  if (s === "badkey") return box("alert", L("Ye link kaam nahi kar raha","This link doesn't work"), "The link is old or incomplete. Paste the full link again.", keyForm);
  return box("alert", L("Internet nahi","You're offline"), "Your portfolio needs an internet connection. Try again once you're online.", `<button class="btn primary" data-act="fam-retry">${L("Dobara koshish karein","Try again")}</button>`);
}
/** Closing prices arrive by themselves (EODHD, run by the database every weekday evening). */
function autoPricesOn(){ const a = FAMILY && UI.fam?.shared?.auto; return !!(a && a.at && (Date.now() - Date.parse(a.at)) < 5 * 864e5); }
function autoPricesLine(){
  if (!autoPricesOn()) return "";
  const pr = UI.fam.shared.prices || {}; const ds = Object.values(pr).filter(x => x.by === "auto").map(x => x.d).sort(); const last = ds[ds.length - 1];
  return `<div class="auto-line small">${ic("check",15,2.4)}<span>Closing prices update by themselves every weekday evening.${last ? ` Latest: <b>${fmtDate(last)}</b>.` : ""}</span></div>`;
}
function famBanner(){
  if (!FAMILY || UI.fam.status !== "ready" || UI.route === "home") return "";
  if (!UI.fam.me) return `<div class="notice gold">${ic("info",18)}<div>${L("Pehle batayein aap kaun hain, phir apni entries kar sakte hain.","First tell us who you are, then you can add your entries.")} <button class="link" data-act="fam-who">${L("Chunein","Choose")}</button></div></div>`;
  if (!UI.readOnly) return "";
  return `<div class="notice info" style="align-items:center">${avatar(UI.fam.viewing, 28)}<div style="flex:1;min-width:0">${L(`Aap <b>${esc(memberName(UI.fam.viewing))}</b> ka portfolio dekh rahe hain. Isme sirf ${esc(memberName(UI.fam.viewing))} entry kar sakte hain.`, `You're viewing <b>${esc(memberName(UI.fam.viewing))}</b>'s portfolio. Only ${esc(memberName(UI.fam.viewing))} can add entries here.`)}</div><button class="btn sm line" data-act="fam-view" data-v="${UI.fam.me}">${L("Mera portfolio","My portfolio")}</button></div>`;
}
function viewBoard(){
  const stats = MEMBERS.map(m => memberStats(m.id)).sort((a, b) => (b.hasData - a.hasData) || (b.pct - a.pct));
  const t0 = todayISO(); const medal = ["🥇","🥈","🥉"];
  const held = famHeldSymbols(); const missing = held.filter(s => !UI.fam.shared.prices[s]);
  const autoOn = autoPricesOn();
  const stale = autoOn ? [] : held.filter(s => UI.fam.shared.prices[s] && UI.fam.shared.prices[s].d < t0);
  const leader = stats[0]?.hasData ? stats[0] : null;
  const awards = [];
  const withData = stats.filter(s => s.hasData);
  if (withData.length){
    const mw = [...withData].sort((a, b) => b.monthPct - a.monthPct)[0]; awards.push(["trend", L("Is mahine aage","Leading this month"), mw.id, `${pct(mw.monthPct, 1, true)} · ${rsS(mw.monthPL)}`]);
    const bp = withData.map(s => s.best && { id: s.id, h: s.best }).filter(Boolean).sort((a, b) => b.h.plPct - a.h.plPct)[0]; if (bp) awards.push(["star", L("Sab se acha share","Best pick"), bp.id, `${bp.h.s} ${pct(bp.h.plPct, 1, true)}`]);
    const dk = [...withData].sort((a, b) => b.divYear - a.divYear)[0]; if (dk.divYear > 0) awards.push(["coin", L(`Dividend king (${fyOf(t0)})`, `Dividend king (${fyOf(t0)})`), dk.id, rs(dk.divYear)]);
    const dw = [...withData].sort((a, b) => b.dayPct - a.dayPct)[0]; if (Math.abs(dw.day) > 0.5) awards.push(["spark", L("Aaj ka winner","Today's winner"), dw.id, `${pct(dw.dayPct, 2, true)} · ${rsS(dw.day)}`]);
  }
  return `
  <div class="page-head"><div style="min-width:0"><div class="eyebrow">Family portfolio · ${fmtDate(t0)}</div><h1 class="h-page">Family investments at a glance</h1></div>
    ${UI.fam.me ? `<button class="btn primary sm" data-go="add">${ic("plus",16,2.2)} ${L("Meri entry","My entry")}</button>` : ""}</div>
  ${autoPricesLine()}
  ${missing.length || stale.length ? `<div class="notice gold" style="align-items:center">${ic("info",18)}<div style="flex:1;min-width:0">${missing.length ? L(`${missing.length} shares ki qeemat abhi darj nahi, is liye un ka munafa 0 gina ja raha hai.`, `${missing.length} share(s) have no price yet, so they count as no gain or loss.`) : L(`${stale.length} shares ki qeemat aaj ki nahi.`, `${stale.length} share(s) don't have today's price.`)} ${L("Ranking theek rakhne ke liye aaj ki qeematein daal dein.","Add today's prices to keep the ranking fair.")}</div><button class="btn sm primary" data-go="portfolio" data-sub="prices">${L("Qeematein","Prices")}</button></div>` : ""}
  <section class="podium" aria-label="${L("Ranking","Ranking")}">${stats.map((s, i) => {
    const m = MEM[s.id]; const me = s.id === UI.fam.me;
    return `<article class="pod ${i === 0 && s.hasData ? "first" : ""}" style="--h:${m.hue}">
      <div class="row" style="gap:10px"><span class="medal" aria-label="${i + 1}">${s.hasData ? medal[i] : "·"}</span>${avatar(s.id, 38)}<div style="min-width:0"><b class="pod-name">${esc(m.name)}</b>${me ? `<span class="pill soft" style="margin-left:6px">${L("Aap","You")}</span>` : ""}<div class="tiny faint">${s.entries} ${s.entries === 1 ? L("entry","entry") : L("entries","entries")}</div></div></div>
      ${s.hasData ? `<div class="pod-pct num ${tone(s.pct)}">${pct(s.pct, 1, true)}</div><div class="num small ${tone(s.sn.totalPL)}" style="font-weight:600">${rsS(s.sn.totalPL)} ${L("kul munafa","total profit")}</div>
      <div class="pod-grid num">
        <div><span>${L("Lagaya","Invested")}</span><b>${rs(s.sn.cost)}</b></div>
        <div><span>${L("Value","Value")}</span><b>${rs(s.sn.mv)}</b></div>
        <div><span>${L("Is mahine","This month")}</span><b class="${tone(s.monthPct)}">${pct(s.monthPct, 1, true)}</b></div>
        <div><span>${L("Aaj","Today")}</span><b class="${tone(s.dayPct)}">${pct(s.dayPct, 2, true)}</b></div>
      </div>` : `<p class="small muted" style="margin:14px 0 6px">${L("Abhi koi share nahi. Pehli entry karte hi muqable mein aa jayenge.","No shares yet. The first entry puts them in the race.")}</p>`}
      <button class="btn sm ${me ? "primary" : "line"} block" data-act="fam-view" data-v="${s.id}">${me ? L("Mera portfolio","My portfolio") : L(`${esc(m.name)} ka portfolio`, `${esc(m.name)}'s portfolio`)} ${ic("chev",14,2.2)}</button>
    </article>`; }).join("")}</section>
  <div class="grid2" style="align-items:start">
    <section class="card pad stack"><div class="row" style="justify-content:space-between"><h2 class="h-sec">${"Our journey"}</h2><span class="tiny faint">${L("kul munafa %","total return %")}</span></div>${raceChart()}</section>
    <section class="card pad stack"><h2 class="h-sec">${L("Awards","Awards")}</h2>
      ${awards.length ? `<div class="awards">${awards.map(([icn, t, id, v]) => `<div class="award" style="--h:${MEM[id].hue}"><span class="qi">${ic(icn,18)}</span><div style="min-width:0"><div class="tiny faint">${esc(t)}</div><div class="row" style="gap:6px;margin-top:2px">${avatar(id, 20)}<b>${esc(memberName(id))}</b></div><div class="small num muted">${esc(v)}</div></div></div>`).join("")}</div>` : `<p class="small muted">${L("Pehli entries aur qeematein aate hi awards yahan nazar aayenge.","Awards show up once the first entries and prices are in.")}</p>`}
    </section>
  </div>
  <p class="footer-note">${L("Ranking kul munafa % par hai: (abhi ki value − lagat + bechne ka munafa + dividend) ÷ jitne ke shares khareede. Is tarah kam ya zyada paisa lagane wale ka muqabla barabar hota hai. Investment ka mashwara nahi.","Ranking uses total return %: (current value − cost + booked profit + dividends) ÷ total bought. That keeps it fair whatever each person invested. Not investment advice.")}</p>`;
}
function famHeldSymbols(){ const set = new Set(); MEMBERS.forEach(m => { for (const [s, p] of replay(UI.fam.states[m.id]?.txs || []).pos) if (p.q > 0) set.add(s); }); return [...set].sort(); }
UPDATE_SHEETS.who = () => ({ title: L("Aap kaun hain?","Who are you?"), body: `<div class="stack">
  <p class="small muted">${L("Is device par yaad rakha jayega. Aap sirf apne naam par entry kar sakte hain; doosron ka portfolio dekh sakte hain.","This device will remember it. You can add entries only under your own name; you can view the others.")}</p>
  ${MEMBERS.map(m => `<button class="big-opt" data-act="fam-me" data-v="${m.id}" style="--h:${m.hue}">${avatar(m.id, 46)}<div><b>${esc(m.name)}</b><span>${UI.fam.me === m.id ? L("Abhi chuna hua","Currently selected") : L("Main hoon","That's me")}</span></div><div class="arrow">${ic("chev",22)}</div></button>`).join("")}
</div>` });

function afterRender(){ liveCalc(); liveEntry(); const c = $("#chat"); if (c) c.scrollTop = c.scrollHeight; }

/* =========================================================================
   Boot
   ========================================================================= */
S = loadLocal();
if (!S || !Array.isArray(S.txs)) S = demoState();
function migrate(st){ if (!st.langChosen) st.lang = "en"; st.readUpd ||= {}; st.readAnn ||= {}; st.annChecks ||= {}; st.reminders = (st.reminders || []).map(r => ({ repeat:"none", src: r.src || "user", ...r })); st.divRecords ||= []; st.events ||= [];
  const b = st.broker; if (!b || typeof b !== "object") st.broker = { asOf: null, qty: {}, cash: null, extra: [] };
  else if (!("qty" in b)){ const qty = {}; let cash = null; for (const [k, v] of Object.entries(b)){ if (k === "__cash") cash = v === "" || v == null ? null : Number(v); else if (v !== "" && v != null && isFinite(Number(v))) qty[k] = Number(v); } st.broker = { asOf: null, qty, cash, extra: [] }; }
  st.settings = { minPerShare: 0, sstPct: 0, otherPct: 0, flatFee: 0, ...st.settings };
  if (st.settings.simple === undefined) st.settings.simple = true;
  st.prices ||= {}; st.customSyms ||= []; st.customSyms.forEach(registerCustom);
  return st; }
S = migrate(S);
const h0 = location.hash.slice(1); if (["home","portfolio","add"].includes(h0)) UI.route = h0;
render();
connectCloud();
connectExtras();
famBoot();
registerSW();
window.matchMedia?.("(prefers-color-scheme: dark)").addEventListener?.("change", () => { if (!S.theme) renderShell(); });
})();
</script>
