# PSX Personal Assistant: a static site built from app/index.html into /site.
# The build runs the engine tests first, so a broken release never goes live.
[build]
  command = "npm test && npm run build"
  publish = "site"

[build.environment]
  NODE_VERSION = "22"

# Older addresses lead to the app.
[[redirects]]
  from = "/personal"
  to = "/"
  status = 301

[[redirects]]
  from = "/personal-assistant.html"
  to = "/"
  status = 301

# Any other unknown page (old /portfolio, /assistant ...) opens the app instead of a 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# The service worker must always be fetched fresh so updates reach installed apps.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
