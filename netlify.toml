# The live site is PSX Personal Assistant: one static page in /site.
# (The older Next.js app is still in this repo but is no longer built or published.)
[build]
  command = "echo 'static site, no build'"
  publish = "site"

# Old addresses lead to the app.
[[redirects]]
  from = "/personal"
  to = "/"
  status = 301

[[redirects]]
  from = "/personal-assistant.html"
  to = "/"
  status = 301

# Every other old page (e.g. /portfolio, /assistant) opens the app instead of a 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(self), geolocation=()"
